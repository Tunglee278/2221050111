<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 5</title>
    <style>
        h2{
            color: pink;
            background-color: green;
        }
        .khoi-1{
            background-color: red;
        }
        .khoi-2{
            background-color: green; 
            /*1. NẾU margin truyền 1 giá trị thì sẽ cách xung quanh =giá trị đó */
            /*2. NẾU margin có 2 giá trị thì giá trị đầu ( trên + dưới), giá trị 2 (trái + phải ) */
            /* 3. NẾU có nhiều giá trị thì sẽ theo thứ tự chiều kim đồng hồ: trên(top)-> phải(right)-> dưới(bottom)-> trái(left) */
            margin: 10px 50px 100PX 200PX
        }
        .khoi-3{
            background-color: yellow;
            padding: 20px
        }
    </style>
    <link rel="stylesheet" href="hihi.css">
</head>
<body>
    <div class="khoi-1">Khối 1</div>
    <div class="khoi-2">Khối 2</div>
    <div class="khoi-3">Khối 3</div>



    <h1 style="color: red; background-color: black;"> INLINE STYLE</h1>
    <!-- Nếu là id sử dụng dấu # + tên id -->
    <!-- ví dụ ở dưới: #tieude-1  -->
    <!-- ví dụ muốn đổi thuộc tính màu ở một chỗ thì dùng id -->
    <h2 id="tieude-1">INTERNAL STYLE</h2> <!--  sau khi sử dụng id thì màu nên thẻ h2 đã đc thay đổi-->
    <h2>TÙNG LÊ</h2>
    <!-- nếu là class thì dùng dấu . + tên class  -->
    <!-- ví dụ đổi dưới: .tieude2  -->
    <h3 class="tieude-2">EXTERNAL STYLE</h3> 
    <h4 id="doimaunen-h4">lê thanh tùng</h4>
    
    <div>Web 4</div>
    <div class="Web4">Web 4</div>
</body>
</html>
