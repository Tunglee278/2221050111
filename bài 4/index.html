<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>
    <style>
        h2{
            color: black;
            background-color:pink
        }
        h3{
            color: orangered;
            background-color: aquamarine;
            
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--CÁCH 1: Inline Style  -->
    <!-- color: quy định màu chữ -->
    <!-- background-color: quy định màu nền  -->
    <h1 style="color: purple; background-color: yellow;">
        Bài STYLE
    </h1>

    <!-- CÁCH 2: Iternal Style  -->
     <!-- cách này cần thêm thẻ <style></style> ở phần <head> và nhập thông tin  -->
    <h2>
        Iternal Style
    </h2>
    <h3>
        Iternal Style tiếp 
    </h3>

        <!-- CÁCH 3: EXTERNAL STYLE    -->
        <!-- cách này cần tạo 1 file ".css" và cần có 1 câu lệnh trên <head> là:<link rel="stylesheet" href="tên file.css"> -->
        <h4>
            External style
        </h4>
    
</body>
</html>
